<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160">
  <style>
    .bg { fill: transparent; }
    .text-name { font-family: -apple-system, sans-serif; font-size: 48px; font-weight: 800; fill: #FFFFFF; opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s; }
    .text-role { font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #A3B3C2; opacity: 0; animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s; letter-spacing: 2px; }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scan {
      from { stroke-dashoffset: 800; }
      to { stroke-dashoffset: 0; }
    }
    .grid-line { stroke: #222222; stroke-width: 1; stroke-dasharray: 800; animation: scan 4s linear infinite; }
  </style>
  
  <rect class="bg" width="800" height="160" />
  
  <g opacity="0.4">
    <path class="grid-line" d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 100 0 L 100 160 M 200 0 L 200 160 M 300 0 L 300 160 M 400 0 L 400 160 M 500 0 L 500 160 M 600 0 L 600 160 M 700 0 L 700 160" />
  </g>

  <g>
    <text x="400" y="85" text-anchor="middle" class="text-name">Nayan Joshy</text>
    <text x="400" y="125" text-anchor="middle" class="text-role">CYBERSECURITY ENGINEER · WEB3 SECURITY · AUDITOR</text>
  </g>
</svg>
