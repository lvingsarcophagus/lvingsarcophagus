<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <style>
    .bg { fill: #0D1117; }
    .text-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #C9D1D9; }
    .text-role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #8B949E; }
    .accent { fill: #58A6FF; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #FFFFFF; }
      .text-name { fill: #24292F; }
      .text-role { fill: #57606A; }
      .accent { fill: #0969DA; }
    }
  </style>
  <rect class="bg" width="800" height="200" rx="8" />
  
  <!-- Subtle background grid/pattern -->
  <g opacity="0.05">
    <path d="M 0 50 L 800 50 M 0 100 L 800 100 M 0 150 L 800 150 M 100 0 L 100 200 M 200 0 L 200 200 M 300 0 L 300 200 M 400 0 L 400 200 M 500 0 L 500 200 M 600 0 L 600 200 M 700 0 L 700 200" stroke="#8B949E" stroke-width="1"/>
  </g>

  <!-- Accent bar -->
  <rect class="accent" x="40" y="55" width="4" height="90" rx="2" />
  
  <text x="60" y="95" class="text-name">Nayan Joshy</text>
  <text x="60" y="135" class="text-role">Cybersecurity Engineer · Web3 Security · Smart Contract Auditor</text>
</svg>
