<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <style>
    .bg { fill: #0D1117; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 24px; font-weight: 600; fill: #C9D1D9; }
    .category { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; fill: #8B949E; text-transform: uppercase; letter-spacing: 1px; }
    .item-bg { fill: #21262D; stroke: #30363D; stroke-width: 1; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; fill: #C9D1D9; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #FFFFFF; }
      .title { fill: #24292F; }
      .category { fill: #57606A; }
      .item-bg { fill: #F6F8FA; stroke: #D0D7DE; }
      .item-text { fill: #24292F; }
    }
  </style>
  <rect class="bg" width="800" height="240" rx="8" />
  
  <text x="40" y="50" class="title">03 — stack</text>
  
  <text x="40" y="90" class="category">Languages</text>
  <g transform="translate(40, 105)">
    <rect class="item-bg" x="0" y="0" width="80" height="28" rx="4" /><text class="item-text" x="40" y="18" text-anchor="middle">Rust</text>
    <rect class="item-bg" x="90" y="0" width="80" height="28" rx="4" /><text class="item-text" x="130" y="18" text-anchor="middle">Solidity</text>
    <rect class="item-bg" x="180" y="0" width="80" height="28" rx="4" /><text class="item-text" x="220" y="18" text-anchor="middle">Go</text>
    <rect class="item-bg" x="270" y="0" width="90" height="28" rx="4" /><text class="item-text" x="315" y="18" text-anchor="middle">TypeScript</text>
    <rect class="item-bg" x="370" y="0" width="80" height="28" rx="4" /><text class="item-text" x="410" y="18" text-anchor="middle">Python</text>
  </g>
  
  <text x="40" y="165" class="category">Security &amp; Tools</text>
  <g transform="translate(40, 180)">
    <rect class="item-bg" x="0" y="0" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">Foundry</text>
    <rect class="item-bg" x="100" y="0" width="90" height="28" rx="4" /><text class="item-text" x="145" y="18" text-anchor="middle">Burp Suite</text>
    <rect class="item-bg" x="200" y="0" width="90" height="28" rx="4" /><text class="item-text" x="245" y="18" text-anchor="middle">Wireshark</text>
    <rect class="item-bg" x="300" y="0" width="90" height="28" rx="4" /><text class="item-text" x="345" y="18" text-anchor="middle">Metasploit</text>
    <rect class="item-bg" x="400" y="0" width="90" height="28" rx="4" /><text class="item-text" x="445" y="18" text-anchor="middle">Chainlink</text>
  </g>
</svg>
