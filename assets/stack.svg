<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 225" width="800" height="225">
  <style>
    .bg { fill: #000000; }
    .title { font-family: -apple-system, sans-serif; font-size: 24px; font-weight: 600; fill: #FFFFFF; }
    .category { font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #A3B3C2; text-transform: uppercase; letter-spacing: 1px; }
    .item-bg { fill: #0A0A0A; stroke: #333333; stroke-width: 1; transition: all 0.2s ease; }
    .item-text { font-family: -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #FFFFFF; transition: all 0.2s ease; pointer-events: none; }
    
    .grp { opacity: 0; animation: fadeIn 0.4s forwards; cursor: pointer; }
    .grp:hover .item-bg { stroke: #FFFFFF; fill: #111111; }
    
    .i1 { animation-delay: 0.1s; }
    .i2 { animation-delay: 0.2s; }
    .i3 { animation-delay: 0.3s; }
    .i4 { animation-delay: 0.4s; }
    .i5 { animation-delay: 0.5s; }
    .i6 { animation-delay: 0.6s; }
    .i7 { animation-delay: 0.7s; }
    .i8 { animation-delay: 0.8s; }
    .i9 { animation-delay: 0.9s; }
    .i10 { animation-delay: 1.0s; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect class="bg" width="800" height="225" rx="8" />
  
  <text x="40" y="50" class="title">03 — stack</text>
  
  <text x="40" y="90" class="category">Languages</text>
  <g transform="translate(40, 105)">
    <g class="grp i1" transform="translate(0, 0)"><rect class="item-bg" width="80" height="28" rx="4" /><text class="item-text" x="40" y="18" text-anchor="middle">Rust</text></g>
    <g class="grp i2" transform="translate(90, 0)"><rect class="item-bg" width="80" height="28" rx="4" /><text class="item-text" x="40" y="18" text-anchor="middle">Solidity</text></g>
    <g class="grp i3" transform="translate(180, 0)"><rect class="item-bg" width="80" height="28" rx="4" /><text class="item-text" x="40" y="18" text-anchor="middle">Go</text></g>
    <g class="grp i4" transform="translate(270, 0)"><rect class="item-bg" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">TypeScript</text></g>
    <g class="grp i5" transform="translate(370, 0)"><rect class="item-bg" width="80" height="28" rx="4" /><text class="item-text" x="40" y="18" text-anchor="middle">Python</text></g>
  </g>
  
  <text x="40" y="165" class="category">Security &amp; Tools</text>
  <g transform="translate(40, 180)">
    <g class="grp i6" transform="translate(0, 0)"><rect class="item-bg" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">Foundry</text></g>
    <g class="grp i7" transform="translate(100, 0)"><rect class="item-bg" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">Burp Suite</text></g>
    <g class="grp i8" transform="translate(200, 0)"><rect class="item-bg" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">Wireshark</text></g>
    <g class="grp i9" transform="translate(300, 0)"><rect class="item-bg" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">Metasploit</text></g>
    <g class="grp i10" transform="translate(400, 0)"><rect class="item-bg" width="90" height="28" rx="4" /><text class="item-text" x="45" y="18" text-anchor="middle">Chainlink</text></g>
  </g>
</svg>
