<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <style>
    .bg { fill: #000000; }
    .title { font-family: -apple-system, sans-serif; font-size: 24px; font-weight: 600; fill: #FFFFFF; }
    .card-bg { fill: #0A0A0A; stroke: #333333; stroke-width: 1; transition: all 0.3s ease; }
    .card-title { font-family: -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #FFFFFF; transition: fill 0.3s ease; }
    .card-body { font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #A3B3C2; transition: fill 0.3s ease; }
    
    .c1 { opacity: 0; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s; }
    .c2 { opacity: 0; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s; }
    .c3 { opacity: 0; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s; }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Interactive Hover Effects */
    .card-wrapper { cursor: pointer; }
    .card-wrapper:hover .card-bg { stroke: #FFFFFF; fill: #111111; }
    .card-wrapper:hover .card-title { fill: #58A6FF; }
    .card-wrapper:hover .card-body { fill: #FFFFFF; }
  </style>
  <rect class="bg" width="800" height="380" rx="8" />
  
  <text x="40" y="50" class="title">02 — projects</text>
  
  <g class="c1 card-wrapper">
    <rect class="card-bg" x="40" y="70" width="720" height="90" rx="6" />
    <text x="60" y="100" class="card-title">Photon</text>
    <text x="60" y="125" class="card-body">Rust-native multi-engine smart contract security scanner combining static analysis, symbolic verification</text>
    <text x="60" y="145" class="card-body">and EVM invariant fuzzing into a single CI-ready SARIF pipeline.</text>
  </g>
  
  <g class="c2 card-wrapper">
    <rect class="card-bg" x="40" y="175" width="720" height="90" rx="6" />
    <text x="60" y="205" class="card-title">SentinelBridge</text>
    <text x="60" y="230" class="card-body">AI-powered cross-chain bridge security layer. Uses LLaMA-3.1 via Groq for real-time threat classification.</text>
    <text x="60" y="250" class="card-body">Solidity 0.8 circuit-breaker contracts automatically halt bridges when risks are detected.</text>
  </g>
  
  <g class="c3 card-wrapper">
    <rect class="card-bg" x="40" y="280" width="720" height="90" rx="6" />
    <text x="60" y="310" class="card-title">TokenomicsLab</text>
    <text x="60" y="335" class="card-body">Production DeFi analytics platform with a proprietary risk-scoring engine. Correlates liquidity locks,</text>
    <text x="60" y="355" class="card-body">holder distribution, and deployer behavior across multiple EVM chains.</text>
  </g>
</svg>
