<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <style>
    .bg { fill: #0D1117; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 500; fill: #8B949E; font-style: italic; }
    .accent { fill: #58A6FF; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #FFFFFF; }
      .text { fill: #57606A; }
      .accent { fill: #0969DA; }
    }
  </style>
  <rect class="bg" width="800" height="120" rx="8" />
  
  <text x="400" y="65" class="text" text-anchor="middle">Open to Web3 security audits, smart contract pen-testing, and security tooling contracts.</text>
</svg>
