<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <style>
    .bg { fill: #000000; }
    .text { font-family: monospace; font-size: 14px; fill: #A3B3C2; opacity: 0; animation: fade 0.1s forwards 0.5s; }
    .cursor { fill: #FFFFFF; opacity: 0; animation: blink 1s step-end infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <rect class="bg" width="800" height="100" rx="8" />
  
  <text x="400" y="65" class="text" text-anchor="middle">&gt; Open to Web3 security audits, smart contract pen-testing, and security tooling contracts.</text>
  <rect class="cursor" x="760" y="55" width="8" height="14" />
</svg>
